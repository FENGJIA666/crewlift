<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">CrewLift — Every change. A stronger plan.</title>
  <desc id="description">AI-powered volunteer coordination. Ten of ten roles filled, seven assignments kept, three people to update. Powered by NVIDIA Nemotron and Nebius Token Factory.</desc>
  <rect width="1200" height="800" fill="#f7f8ef"/>
  <path d="M864 0H1200V364C1077 333 1006 237 864 0Z" fill="#edf1e2"/>
  <g transform="translate(70 57)">
