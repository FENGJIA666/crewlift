  <text x="70" y="351" font-family="Arial, Helvetica, sans-serif" font-size="85" font-weight="700" letter-spacing="-4" fill="#193b37">A stronger plan.</text>
  <text x="75" y="413" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#4d6655">Turn a change brief into a crew ready for what’s next.</text>
  <g transform="translate(904 175)">
