  <text x="600" y="748" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" letter-spacing=".3" fill="#395c4e">NVIDIA Nemotron <tspan fill="#7d9473">+</tspan> Nebius Token Factory</text>
