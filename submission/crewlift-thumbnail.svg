    <text x="246" y="632" font-size="27" font-weight="400" fill="#f7f8ef">roles filled</text>
    <text x="600" y="579" font-size="80" font-weight="700" fill="#deefbc">7</text>
    <text x="600" y="632" font-size="27" font-weight="400" fill="#f7f8ef">assignments kept</text>
    <text x="954" y="579" font-size="80" font-weight="700" fill="#deefbc">3</text>
    <text x="954" y="632" font-size="27" font-weight="400" fill="#f7f8ef">people to update</text>
