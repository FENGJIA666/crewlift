  </g>
  <text x="148" y="105" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" letter-spacing="-2" fill="#193b37">CrewLift<tspan fill="#668651">.</tspan></text>
  <text x="1130" y="95" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#496854">VOLUNTEER COORDINATION</text>
